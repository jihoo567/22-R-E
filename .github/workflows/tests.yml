name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install .
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Test Windows launcher from a Unicode path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "한글 경로"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Copy-Item kpr.bat $smoke
          python -m venv (Join-Path $smoke ".venv")
          & (Join-Path $smoke ".venv\Scripts\python.exe") -m pip install .
          Push-Location $smoke
          & .\kpr.bat --help
          & .\kpr.bat configure --test local --judge local
          if (-not (Test-Path .\.kpr\config.json)) {
            throw "Configuration was not saved beside kpr.bat"
          }
          Pop-Location
