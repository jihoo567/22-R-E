name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bootstrap on Linux
        if: runner.os == 'Linux'
        run: ./kpr --help
      - name: Bootstrap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\kpr.bat --help
      - name: Test
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .venv/Scripts/python.exe -m unittest discover -s tests -v
          else
            .venv/bin/python -m unittest discover -s tests -v
          fi
      - name: Test Windows launcher from a Unicode path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $smoke = Join-Path $env:RUNNER_TEMP "한글 경로"
          $archive = Join-Path $env:RUNNER_TEMP "kpr-source.zip"
          git archive --format=zip --output=$archive HEAD
          Expand-Archive -Path $archive -DestinationPath $smoke
          Push-Location $smoke
          & .\kpr.bat --help
          & .\kpr.bat show-config
          if (-not (Test-Path .\kpr-config.json)) {
            throw "Configuration was not created beside kpr.bat"
          }
          Pop-Location
