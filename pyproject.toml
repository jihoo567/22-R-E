[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korean-prompt-robustness"
version = "0.6.0"
description = "사전 설정한 테스트 모델과 Judge 모델의 응답을 콘솔에 출력하는 최소 벤치마크"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
kpr = "korean_prompt_robustness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false
